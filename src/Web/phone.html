<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<title>Island</title>
<style>
  :root { --bg:#000; --card:#141416; --text:#f5f5f7; --dim:#8e8e93; --blue:#0a84ff; --green:#30d158; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--text); }
  body { font:16px/1.4 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; max-width:560px; margin:0 auto;
         padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 28px); }
  .brand { display:flex; align-items:center; gap:10px; font-weight:600; font-size:15px; }
  .eyes { display:inline-flex; gap:5px; padding:8px 11px; border-radius:999px; background:#1c1c1e; }
  .eyes i { width:7px; height:10px; border-radius:4px; background:#fff; display:block; animation:blink 5s infinite; }
  @keyframes blink { 0%, 92%, 100% { transform:scaleY(1); } 95% { transform:scaleY(.15); } }
  h1 { font-size:31px; margin:22px 0 2px; letter-spacing:-.02em; transition:color .3s; }
  .sub { color:var(--dim); font-size:14px; margin:0 0 22px; }
  .btn { appearance:none; border:0; width:100%; padding:17px; border-radius:16px; background:var(--blue); color:#fff;
         font:600 17px/1 -apple-system, system-ui, sans-serif; display:flex; gap:9px; align-items:center; justify-content:center; cursor:pointer; }
  .btn:active { transform:scale(.98); }
  .section { margin:28px 0 10px; color:var(--dim); font-size:12.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; }
  .list { display:flex; flex-direction:column; gap:10px; }
  .row { display:flex; align-items:center; gap:12px; background:var(--card); border-radius:16px; padding:10px 12px;
         animation:pop .35s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes pop { from { transform:translateY(8px) scale(.97); opacity:0; } to { transform:none; opacity:1; } }
  .thumb { width:46px; height:46px; border-radius:11px; background:#2c2c2e center/cover no-repeat; flex:none;
           display:grid; place-items:center; font-size:10.5px; font-weight:700; color:#aaa; text-decoration:none; }
  .meta { flex:1; min-width:0; }
  .name { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .small { font-size:12.5px; color:var(--dim); }
  .ok { color:var(--green); }
  .save { background:var(--blue); color:#fff; border-radius:999px; padding:8px 16px; font-weight:600; font-size:14px; text-decoration:none; flex:none; }
  .save.done { background:#163a22; color:var(--green); }
  .empty { color:var(--dim); font-size:14px; padding:16px; background:var(--card); border-radius:16px; text-align:center; }
  .bar { height:4px; background:#2c2c2e; border-radius:2px; overflow:hidden; margin-top:7px; }
  .bar > i { display:block; height:100%; width:0; background:var(--blue); transition:width .2s; }
  .foot { margin-top:30px; color:var(--dim); font-size:12px; text-align:center; line-height:1.5; }
  .off h1 { color:var(--dim); }
  .off .btn { opacity:.4; pointer-events:none; }
  #picker { position:absolute; left:-9999px; width:1px; height:1px; opacity:0; }
</style>
</head>
<body>
  <div class="brand"><span class="eyes"><i></i><i></i></span> Island</div>
  <h1 id="title">Connected</h1>
  <p class="sub" id="subtitle">to {{PC}}</p>

  <button class="btn" id="send" type="button">&#8593;&nbsp; Send to PC</button>
  <input id="picker" type="file" multiple>
  <div id="uploads" class="list" style="margin-top:12px"></div>

  <div class="section">From your PC</div>
  <div id="files" class="list"><div class="empty">Loading…</div></div>

  <p class="foot">&#128274; Goes straight to your PC over this Wi-Fi.<br>This link stops working after an hour.</p>

<script>
const BASE = "{{BASE}}";
const $ = s => document.querySelector(s);
let version = -1, alive = true, busy = false;
const pending = [];
const saved = new Set();

function size(n) {
  if (n < 1024) return n + " B";
  if (n < 1048576) return Math.round(n / 1024) + " kB";
  if (n < 1073741824) return (n / 1048576).toFixed(1) + " MB";
  return (n / 1073741824).toFixed(2) + " GB";
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function loadFiles() {
  const r = await fetch(BASE + "api/files", { cache: "no-store" });
  if (!r.ok) throw new Error("files");
  const data = await r.json();
  render(data.files);
}

function render(files) {
  const box = $("#files");
  if (!files.length) {
    box.innerHTML = '<div class="empty">Nothing in the tray yet.<br>Drop files on the island on your PC.</div>';
    return;
  }
  box.innerHTML = files.map(f => {
    const thumb = f.thumb ? ` style="background-image:url('${BASE}api/thumb/${f.id}')"` : "";
    const label = f.thumb ? "" : esc(f.ext || "FILE");
    const done = saved.has(f.id);
    return `<div class="row">
      <a class="thumb" href="${BASE}api/file/${f.id}" target="_blank" rel="noopener"${thumb}>${label}</a>
      <div class="meta"><div class="name">${esc(f.name)}</div>
        <div class="small">${done ? '<span class="ok">Saved</span>' : esc(f.ext || "File") + " · " + size(f.size)}</div></div>
      <a class="save${done ? " done" : ""}" href="${BASE}api/file/${f.id}?dl=1" download="${esc(f.name)}" data-id="${f.id}">${done ? "Saved" : "Save"}</a>
    </div>`;
  }).join("");
  box.querySelectorAll(".save").forEach(a => a.addEventListener("click", () => {
    saved.add(a.dataset.id);
    setTimeout(() => { a.textContent = "Saved"; a.classList.add("done"); }, 500);
  }));
}

async function ping() {
  try {
    const r = await fetch(BASE + "api/ping", { cache: "no-store" });
    if (!r.ok) throw new Error("ping");
    const d = await r.json();
    if (!alive) {
      alive = true;
      document.body.classList.remove("off");
      $("#title").textContent = "Connected";
      $("#subtitle").textContent = "to " + d.pc;
    }
    if (d.v !== version) { version = d.v; await loadFiles(); }
  } catch (e) {
    if (alive) {
      alive = false;
      document.body.classList.add("off");
      $("#title").textContent = "Not connected";
      $("#subtitle").textContent = "The PC stopped sharing, or this phone left its Wi-Fi.";
    }
  }
}

$("#send").addEventListener("click", () => $("#picker").click());
$("#picker").addEventListener("change", e => {
  const files = [...e.target.files];
  e.target.value = "";
  pending.push(...files);
  if (!busy) next();
});

function next() {
  const f = pending.shift();
  if (!f) { busy = false; return; }
  busy = true;
  upload(f).finally(next);
}

function upload(f) {
  return new Promise(done => {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<div class="thumb">&#8593;</div><div class="meta"><div class="name">${esc(f.name)}</div>
      <div class="small">Sending · ${size(f.size)}</div><div class="bar"><i></i></div></div>`;
    $("#uploads").prepend(row);
    const x = new XMLHttpRequest();
    x.open("PUT", BASE + "api/upload?name=" + encodeURIComponent(f.name));
    x.upload.onprogress = e => {
      if (e.lengthComputable) row.querySelector(".bar i").style.width = (e.loaded / e.total * 100).toFixed(1) + "%";
    };
    x.onload = () => {
      const ok = x.status === 200;
      row.querySelector(".small").innerHTML = ok ? '<span class="ok">On your PC</span> · ' + size(f.size) : "Did not arrive, try again";
      const bar = row.querySelector(".bar");
      if (bar) bar.remove();
      done();
    };
    x.onerror = () => { row.querySelector(".small").textContent = "Did not arrive, try again"; done(); };
    x.send(f);
  });
}

ping();
setInterval(ping, 2000);
</script>
</body>
</html>
